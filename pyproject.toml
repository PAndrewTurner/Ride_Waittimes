[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parkwaits"
version = "0.1.0"
description = "Theme park wait time data collection agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "tenacity>=8.2.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "duckdb>=0.10.0",
    "holidays>=0.40",
    "astral>=3.2",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
ml = ["scikit-learn", "xgboost", "prophet"]
dashboard = ["streamlit", "plotly"]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
parkwaits = "parkwaits.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
