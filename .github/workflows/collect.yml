name: Collect Data

on:
  schedule:
    - cron: '0 11-23,0-4 * * *'  # Covers 7AM-midnight ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect all data
        run: python collect_all.py

      - name: Commit and push
        run: |
          git config user.name "parkwaits-bot"
          git config user.email "parkwaits-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(TZ=America/New_York date +'%Y-%m-%d %H:%M %Z')
            git commit -m "data: ${TIMESTAMP}"
            git pull --rebase origin main || true
            git push
          fi
