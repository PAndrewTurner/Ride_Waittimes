name: Hourly Collection

on:
  schedule:
    - cron: '0 11-23,0-4 * * *'  # Covers 7AM-midnight ET in both EST and EDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/New_York

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Collect hourly data
        run: python -m parkwaits collect hourly

      - name: Commit and push
        run: |
          git config user.name "parkwaits-bot"
          git config user.email "parkwaits-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date +'%Y-%m-%d %H:%M %Z')
            git commit -m "data: hourly ${TIMESTAMP}"
            git pull --rebase origin main || true
            git push
          fi
