name: Weekly Maintenance

on:
  schedule:
    - cron: '0 12 * * 1'  # Monday ~8AM ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/New_York

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Refresh ride metadata
        run: python scripts/seed_dimensions.py

      - name: Refresh events catalog
        run: python scripts/seed_events.py

      - name: Build feature store
        continue-on-error: true
        run: python -m parkwaits.build_features

      - name: Commit and push
        run: |
          git config user.name "parkwaits-bot"
          git config user.email "parkwaits-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: weekly maintenance $(date +'%Y-%m-%d')"
            git pull --rebase origin main || true
            git push
          fi
