name: Daily Collection

on:
  schedule:
    - cron: '0 10,22 * * *'  # ~6AM and ~6PM ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/New_York

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Collect daily data
        run: python -m parkwaits collect daily

      - name: Build feature store
        continue-on-error: true
        run: python -m parkwaits.build_features

      - name: Commit and push
        run: |
          git config user.name "parkwaits-bot"
          git config user.email "parkwaits-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date +'%Y-%m-%d %H:%M %Z')
            git commit -m "data: daily ${TIMESTAMP}"
            git pull --rebase origin main || true
            git push
          fi
